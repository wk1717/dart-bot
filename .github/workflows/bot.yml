name: dart-bot

on:
  # GitHub schedule은 몇 시간씩 밀려서 안 씀. cron-job.org가 dispatch로 실행
  # 수집: 평일 KST 08:00~18:50 10분마다, 요약: 평일 KST 19:05
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [collect, summary]
        default: collect

concurrency:
  group: dart-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: run
        run: |
          if [ "${{ inputs.command }}" = "summary" ]; then
            python3 bot.py summary
          else
            python3 bot.py
          fi

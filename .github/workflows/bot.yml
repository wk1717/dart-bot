name: dart-bot

on:
  schedule:
    # GitHub cron은 UTC (KST = UTC+9)
    - cron: "*/10 23 * * 0-4"  # 수집: 평일 KST 08:00~08:50
    - cron: "*/10 0-9 * * 1-5" # 수집: 평일 KST 09:00~18:50
    - cron: "5 10 * * 1-5"     # 요약: 평일 KST 19:05
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [collect, summary]
        default: collect

concurrency:
  group: dart-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: run
        run: |
          if [ "${{ github.event.schedule }}" = "5 10 * * 1-5" ] || [ "${{ inputs.command }}" = "summary" ]; then
            python3 bot.py summary
          else
            python3 bot.py
          fi
